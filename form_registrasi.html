<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi</title>
        <style>
            .registrasi {
                color: blue;
                /* text-align: center; */
                font-weight: bold;
                font-style: italic;
            }
        </style>

    <h1 class="registrasi">Registrasi Online</h1>
</head>
<body>
    <form>
        <label for="username">Nama:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="button" onclick="tampilkannama()">
            Daftar</button>
    </form>

    <script>
        function tampilkannama() {
            var nama = document.getElementById("username").value;
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;

            // ambil data dari form
            alert("Nama: " + nama + "\nEmail: " + email + "\nPassword: " + password);

            // simpan data ke database atau lakukan validasi            
        }
    </script>
</body>
</html>
