<section class="w-full max-w-[430px] bg-[#222426] rounded-xl shadow-2xl p-8 sm:p-9 border border-neutral-800/80" data-purpose="login-modal-card">
<!-- Card Title -->
<h1 class="text-center text-2xl font-normal text-white mb-7 tracking-wide">
        Masuk

<!-- Login Form -->
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault()">
<!-- Username or Email Field -->
<div class="space-y-1.5" data-purpose="input-group-username">
<label class="block text-xs font-normal text-neutral-300" for="username">
            Username atau Email
          </label>

</div>
<!-- Password Field -->
<div class="space-y-1.5 pt-1" data-purpose="input-group-password">
<label class="block text-xs font-normal text-neutral-300" for="password">
            Password
          </label>
<div class="relative">
<input autocomplete="current-password" class="w-full h-11 pl-3.5 pr-11 rounded-md text-sm text-neutral-100 placeholder-neutral-500 bg-[#35373b] border border-[#484b52] focus:border-neutral-400 focus:bg-[#393b40] transition outline-none" id="password" name="password" placeholder="" type="password">
<!-- Toggle Password Visibility Icon -->
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-400 hover:text-neutral-200 transition focus:outline-none" data-purpose="password-visibility-toggle" id="toggle-password" type="button">
<!-- Eye Icon (Open) -->

</svg>
</button>

<!-- BEGIN: InteractiveScripts -->
<script data-purpose="password-toggle">
    const toggleButton = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    if (toggleButton && passwordInput) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Slightly change opacity to reflect toggled state
        toggleButton.classList.toggle('text-amber-400', isPassword);
        toggleButton.classList.toggle('text-neutral-400', !isPassword);
      });
    }
  </script>
<!-- END: InteractiveScripts -->
