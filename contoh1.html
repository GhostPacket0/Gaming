<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form Latihan</title>
</head>
<body>
    <h2>Form Latihan (Data Dummy)</h2>
    <form id="latihanForm">
        <label>Nama (dummy): <input name="nama" required></label><br><br>
        <label>Pesan (dummy): <input name="pesan" required></label><br><br>
        <button type="submit">Kirim</button>
    </form>

    <script>
        document.getElementById('latihanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            await fetch('https://webhook.site/xxxx-xxxx-xxxx', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            alert('Terkirim (data dummy)');
        });
    </script>
</body>
</html>
